<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4E342E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C5A028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941D;stop-opacity:1" />
    </linearGradient>
    <filter id="shad">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Pannello legno -->
  <rect x="4" y="4" width="56" height="56" rx="6" fill="url(#woodGrad)" filter="url(#shad)"/>

  <!-- Bordo esterno -->
  <rect x="4" y="4" width="56" height="56" rx="6" fill="none" stroke="#8D6E63" stroke-width="1.5"/>

  <!-- Bordo interno decorativo -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="url(#metalGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Tavolo centrale -->
  <g transform="translate(32, 28)">
    <ellipse cy="0" rx="12" ry="3" fill="#6D4C41"/>
    <ellipse cy="-1" rx="12" ry="3" fill="#8D6E63" opacity="0.7"/>
    <ellipse cy="-1" rx="12" ry="3" fill="none" stroke="url(#metalGrad)" stroke-width="0.5"/>
    <rect x="-1.5" y="0" width="3" height="8" fill="#6D4C41" rx="1.5"/>
    <ellipse cy="8" rx="3.5" ry="1.5" fill="#5D4037"/>
  </g>

  <!-- Piatto -->
  <g transform="translate(32, 22)">
    <circle r="3" fill="#FFFEF7" stroke="#D4AF37" stroke-width="0.5"/>
    <circle r="2" fill="#FFF8E1"/>
  </g>

  <!-- Forchetta -->
  <g transform="translate(20, 28)">
    <rect width="0.8" height="6" fill="url(#metalGrad)"/>
    <rect x="-0.8" width="0.5" height="2" fill="url(#metalGrad)"/>
    <rect x="0.3" width="0.5" height="2" fill="url(#metalGrad)"/>
    <rect x="1.3" width="0.5" height="2" fill="url(#metalGrad)"/>
  </g>

  <!-- Coltello -->
  <g transform="translate(43, 28)">
    <rect width="0.8" height="6" fill="url(#metalGrad)"/>
    <path d="M -0.3 0 L 1.1 0 L 1 -1.5 L 0 -1.5 Z" fill="url(#metalGrad)"/>
  </g>

  <!-- Lettera D stilizzata -->
  <text x="32" y="50" font-family="serif" font-size="16" font-weight="bold" fill="#D4AF37" text-anchor="middle">
    D
  </text>
  <text x="32" y="50" font-family="serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle" opacity="0.3" transform="translate(0.5,0.5)">
    D
  </text>

  <!-- Chiodi angoli -->
  <circle cx="12" cy="12" r="1.5" fill="url(#metalGrad)" opacity="0.7"/>
  <circle cx="52" cy="12" r="1.5" fill="url(#metalGrad)" opacity="0.7"/>
  <circle cx="12" cy="52" r="1.5" fill="url(#metalGrad)" opacity="0.7"/>
  <circle cx="52" cy="52" r="1.5" fill="url(#metalGrad)" opacity="0.7"/>
</svg>
