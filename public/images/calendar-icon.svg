<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#84CC16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#65A30D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Calendar base -->
  <rect x="50" y="80" width="300" height="280" rx="20" fill="url(#calGrad)"/>
  <rect x="60" y="90" width="280" height="260" rx="15" fill="white"/>

  <!-- Calendar header -->
  <rect x="60" y="90" width="280" height="60" rx="15" fill="url(#calGrad)"/>
  <text x="200" y="130" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">SETTEMBRE</text>

  <!-- Binding rings -->
  <circle cx="120" cy="70" r="8" fill="#4D7C0F"/>
  <circle cx="200" cy="70" r="8" fill="#4D7C0F"/>
  <circle cx="280" cy="70" r="8" fill="#4D7C0F"/>

  <!-- Calendar grid -->
  <g transform="translate(80, 180)">
    <!-- Days of week -->
    <text x="20" y="0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="600">L</text>
    <text x="60" y="0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="600">M</text>
    <text x="100" y="0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="600">M</text>
    <text x="140" y="0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="600">G</text>
    <text x="180" y="0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="600">V</text>
    <text x="220" y="0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="600">S</text>
    <text x="260" y="0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="600">D</text>

    <!-- Week 1 -->
    <text x="20" y="35" font-size="16" fill="#9CA3AF" text-anchor="middle">1</text>
    <text x="60" y="35" font-size="16" fill="#9CA3AF" text-anchor="middle">2</text>
    <text x="100" y="35" font-size="16" fill="#111827" text-anchor="middle" font-weight="600">3</text>
    <circle cx="100" cy="27" r="18" fill="#84CC16" opacity="0.2"/>
    <text x="140" y="35" font-size="16" fill="#111827" text-anchor="middle">4</text>
    <text x="180" y="35" font-size="16" fill="#111827" text-anchor="middle">5</text>
    <text x="220" y="35" font-size="16" fill="#111827" text-anchor="middle">6</text>
    <text x="260" y="35" font-size="16" fill="#EF4444" text-anchor="middle">7</text>

    <!-- Week 2 -->
    <text x="20" y="75" font-size="16" fill="#111827" text-anchor="middle">8</text>
    <text x="60" y="75" font-size="16" fill="#111827" text-anchor="middle">9</text>
    <text x="100" y="75" font-size="16" fill="#111827" text-anchor="middle">10</text>
    <text x="140" y="75" font-size="16" fill="#111827" text-anchor="middle" font-weight="600">11</text>
    <circle cx="140" cy="67" r="18" fill="#10B981" opacity="0.2"/>
    <text x="180" y="75" font-size="16" fill="#111827" text-anchor="middle">12</text>
    <text x="220" y="75" font-size="16" fill="#111827" text-anchor="middle">13</text>
    <text x="260" y="75" font-size="16" fill="#EF4444" text-anchor="middle">14</text>

    <!-- Week 3 -->
    <text x="20" y="115" font-size="16" fill="#111827" text-anchor="middle" font-weight="600">15</text>
    <circle cx="20" cy="107" r="18" fill="#84CC16" opacity="0.2"/>
    <text x="60" y="115" font-size="16" fill="#111827" text-anchor="middle">16</text>
    <text x="100" y="115" font-size="16" fill="#111827" text-anchor="middle">17</text>
    <text x="140" y="115" font-size="16" fill="#111827" text-anchor="middle">18</text>
    <text x="180" y="115" font-size="16" fill="#111827" text-anchor="middle" font-weight="600">19</text>
    <circle cx="180" cy="107" r="18" fill="#F59E0B" opacity="0.2"/>
    <text x="220" y="115" font-size="16" fill="#111827" text-anchor="middle">20</text>
    <text x="260" y="115" font-size="16" fill="#EF4444" text-anchor="middle">21</text>
  </g>

  <!-- Checkmark indicator -->
  <g transform="translate(320, 240)">
    <circle r="25" fill="#10B981"/>
    <path d="M -8 0 L -3 8 L 10 -8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
