<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sfondo insegna in legno -->
  <defs>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4E342E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C5A028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941D;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Catena di sospensione sinistra -->
  <g opacity="0.8">
    <rect x="85" y="5" width="3" height="15" fill="url(#metalGradient)" rx="1.5"/>
    <ellipse cx="86.5" cy="5" rx="4" ry="2" fill="url(#metalGradient)"/>
  </g>

  <!-- Catena di sospensione destra -->
  <g opacity="0.8">
    <rect x="212" y="5" width="3" height="15" fill="url(#metalGradient)" rx="1.5"/>
    <ellipse cx="213.5" cy="5" rx="4" ry="2" fill="url(#metalGradient)"/>
  </g>

  <!-- Pannello principale in legno -->
  <rect x="50" y="20" width="200" height="140" rx="8" fill="url(#woodGradient)" filter="url(#shadow)"/>

  <!-- Bordo decorativo esterno -->
  <rect x="50" y="20" width="200" height="140" rx="8" fill="none" stroke="#8D6E63" stroke-width="2"/>

  <!-- Bordo decorativo interno -->
  <rect x="58" y="28" width="184" height="124" rx="6" fill="none" stroke="url(#metalGradient)" stroke-width="1.5" opacity="0.6"/>

  <!-- Texture venature del legno -->
  <g opacity="0.15">
    <path d="M 70 40 Q 150 45 230 40" stroke="#000000" stroke-width="1" fill="none"/>
    <path d="M 70 60 Q 150 55 230 60" stroke="#000000" stroke-width="0.8" fill="none"/>
    <path d="M 70 100 Q 150 105 230 100" stroke="#000000" stroke-width="1.2" fill="none"/>
    <path d="M 70 130 Q 150 125 230 130" stroke="#000000" stroke-width="0.9" fill="none"/>
  </g>

  <!-- Tavolo rotondo centrale -->
  <g transform="translate(150, 80)">
    <!-- Superficie tavolo -->
    <ellipse cy="0" rx="28" ry="6" fill="#6D4C41"/>
    <ellipse cy="-2" rx="28" ry="6" fill="#8D6E63" opacity="0.7"/>

    <!-- Bordo tavolo decorativo -->
    <ellipse cy="-2" rx="28" ry="6" fill="none" stroke="url(#metalGradient)" stroke-width="1"/>

    <!-- Gamba tavolo -->
    <rect x="-3" y="0" width="6" height="20" fill="#6D4C41" rx="3"/>
    <ellipse cy="20" rx="8" ry="3" fill="#5D4037"/>
  </g>

  <!-- Piatti e posate disposte intorno -->
  <!-- Piatto superiore -->
  <g transform="translate(150, 60)">
    <circle r="6" fill="#FFFEF7" stroke="#D4AF37" stroke-width="0.8"/>
    <circle r="4" fill="#FFF8E1"/>
  </g>

  <!-- Forchetta sinistra -->
  <g transform="translate(115, 75)">
    <rect x="0" y="0" width="1.2" height="12" fill="url(#metalGradient)"/>
    <rect x="-1.5" y="0" width="0.8" height="3.5" fill="url(#metalGradient)"/>
    <rect x="0.5" y="0" width="0.8" height="3.5" fill="url(#metalGradient)"/>
    <rect x="2.5" y="0" width="0.8" height="3.5" fill="url(#metalGradient)"/>
  </g>

  <!-- Coltello destro -->
  <g transform="translate(183, 75)">
    <rect x="0" y="0" width="1.2" height="12" fill="url(#metalGradient)"/>
    <path d="M -0.5 0 L 1.7 0 L 1.5 -3 L 0 -3 Z" fill="url(#metalGradient)"/>
  </g>

  <!-- Boccale di birra -->
  <g transform="translate(200, 75)">
    <rect x="0" y="0" width="10" height="14" rx="1" fill="#8D6E63" opacity="0.3" stroke="url(#metalGradient)" stroke-width="0.8"/>
    <ellipse cx="5" cy="0" rx="5" ry="1.5" fill="#6D4C41"/>
    <rect x="10" y="4" width="4" height="6" rx="2" fill="none" stroke="url(#metalGradient)" stroke-width="0.8"/>
    <!-- Schiuma -->
    <ellipse cx="5" cy="1" rx="4" ry="2" fill="#FFF8E1" opacity="0.8"/>
  </g>

  <!-- Testo "DinnerTable" in stile vintage -->
  <text x="150" y="125" font-family="serif" font-size="24" font-weight="bold" fill="#D4AF37" text-anchor="middle" letter-spacing="1">
    DinnerTable
  </text>

  <!-- Ombra testo per profondità -->
  <text x="150" y="125" font-family="serif" font-size="24" font-weight="bold" fill="#1A1A1A" text-anchor="middle" letter-spacing="1" opacity="0.3" transform="translate(1,1)">
    DinnerTable
  </text>

  <!-- Sottotitolo decorativo -->
  <text x="150" y="142" font-family="serif" font-size="9" font-style="italic" fill="#C5A028" text-anchor="middle" letter-spacing="2">
    ~ EST. 2025 ~
  </text>

  <!-- Chiodi decorativi agli angoli -->
  <circle cx="65" cy="35" r="2.5" fill="url(#metalGradient)" opacity="0.7"/>
  <circle cx="235" cy="35" r="2.5" fill="url(#metalGradient)" opacity="0.7"/>
  <circle cx="65" cy="145" r="2.5" fill="url(#metalGradient)" opacity="0.7"/>
  <circle cx="235" cy="145" r="2.5" fill="url(#metalGradient)" opacity="0.7"/>
</svg>
